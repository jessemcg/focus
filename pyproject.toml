[project]
name = "focus"
version = "0.1.0"
description = "Libadwaita GTK4 app for browsing court transcripts with paging, grep, images, AI summaries, and citation-grounded Agent search."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markdown-it-py>=4.0.0",
    "pygobject==3.54.5",
]

[project.scripts]
focus = "focus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
