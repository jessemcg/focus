[project]
name = "focus"
version = "0.1.0"
description = "Libadwaita GTK4 app for browsing court transcripts with paging, grep, images, and AI summaries/RAG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.4.1",
    "isaacus>=0.19.0",
    "langchain>=1.2.6",
    "langchain-chroma>=1.1.0",
    "langchain-voyageai>=0.3.2",
    "pygobject==3.54.5",
]

[project.scripts]
focus = "focus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
